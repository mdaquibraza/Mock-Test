*{box-sizing:border-box}
body{margin:0;background:var(--bg);background-image:var(--bgi);background-attachment:fixed;color:var(--tx);font:16px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
#app{max-width:680px;margin:0 auto;padding:16px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:18px;margin-bottom:14px;box-shadow:0 2px 12px rgba(0,0,0,.12)}
h1{font-size:22px;margin:0 0 6px}h2{font-size:18px;margin:0 0 12px;line-height:1.4}
.mu{color:var(--mu);font-size:14px}
button{font:inherit;cursor:pointer;border-radius:10px;border:1px solid var(--bd);background:var(--card);color:var(--tx);padding:10px 14px}
button.p{background:var(--ac);color:var(--act);border-color:var(--ac);font-weight:600}
button.opt{display:block;width:100%;text-align:left;margin-bottom:8px}
button.opt.ok{background:var(--okb);border-color:var(--ok);color:var(--ok)}
button.opt.no{background:var(--nob);border-color:var(--no);color:var(--no)}
.bar{height:6px;background:var(--bd);border-radius:3px;margin-bottom:14px;overflow:hidden}.bar i{display:block;height:100%;background:var(--ac)}
.ex{margin-top:10px;padding:10px 12px;border-radius:10px;background:var(--bg);font-size:14px}
input[type=text],textarea{width:100%;font:inherit;color:var(--tx);background:var(--bg);border:1px solid var(--bd);border-radius:8px;padding:8px 10px;margin-bottom:6px}
textarea{min-height:60px;resize:vertical}
.row{display:flex;gap:8px;align-items:center}.row input[type=text]{flex:1}
.top{display:flex;gap:8px;flex-wrap:wrap;align-items:center;justify-content:space-between}
.big{font-size:44px;font-weight:700;margin:6px 0}
.msg{margin-top:8px;font-size:14px}
.brand{text-align:center;padding:18px 14px;margin-bottom:14px;border-radius:14px;background:linear-gradient(135deg,#f76b1c,#e8368f 35%,#7048e8 70%,#2b8fff);color:#fff}.bn{font-size:21px;font-weight:700;letter-spacing:.3px}.bs{font-size:14px;opacity:.95;margin-top:4px;font-weight:600}.bt{display:inline-block;margin-top:10px;padding:3px 14px;border-radius:20px;background:rgba(255,255,255,.2);font-size:12px;font-weight:700;letter-spacing:2px}
.badge{display:inline-block;padding:6px 12px;margin:4px 6px 4px 0;border-radius:20px;background:var(--okb);color:var(--ok);font-weight:600;font-size:14px}

function confetti(n){const c=['#e4572e','#f3a712','#2f9e6e','#3b82f6','#a855f7'];for(let k=0;k<n;k++){const d=document.createElement('i');d.style.cssText='position:fixed;top:-10px;left:'+Math.random()*100+'vw;width:8px;height:12px;pointer-events:none;z-index:99;background:'+c[k%5];document.body.appendChild(d);d.animate([{transform:'translateY(0) rotate(0deg)',opacity:1},{transform:'translateY('+(60+Math.random()*40)+'vh) rotate('+Math.random()*720+'deg)',opacity:0}],{duration:1500+Math.random()*1500,easing:'ease-in'}).onfinish=()=>d.remove()}}
function home(){const L=[];if(grp===null){const seen={};V.chapters.forEach((c,k)=>{if(c.g){if(!seen[c.g]){seen[c.g]={g:c.g,k:k,n:0,q:0};L.push(seen[c.g])}seen[c.g].n++;seen[c.g].q+=c.questions.length}else L.push({k:k})})}else V.chapters.forEach((c,k)=>{if(c.g===grp)L.push({k:k})});return '<div class="card"><h1>'+esc(grp===null?V.title:grp)+'</h1><p class="mu">'+(grp===null?'Select a chapter to start its mock test.':'Select a part to start its mock test.')+' Correct answer: +'+num(V.pm,1)+' marks'+(num(V.nm,0)?', wrong answer: -'+num(V.nm,0)+' marks':', no negative marking')+(V.tm?', '+V.tm+' seconds per question':'')+'.</p></div>'+(grp!==null?'<p><button data-act="up">← All chapters</button></p>':'')+L.map((it,z)=>{const k=it.k,c=V.chapters[k];if(it.g)return '<button class="opt" data-act="group" data-g="'+esc(it.g)+'" style="padding:14px 16px;border-left:6px solid '+['#f76b1c','#e8368f','#7048e8','#2b8fff','#1fa971'][z%5]+'"><b>'+(z+1)+'. '+esc(it.g)+'</b><br><span class="mu">'+it.n+(it.n===1?' part':' parts')+' · '+it.q+' questions</span></button>';return '<button class="opt" data-act="open" data-j="'+k+'" style="padding:14px 16px;border-left:6px solid '+['#f76b1c','#e8368f','#7048e8','#2b8fff','#1fa971'][z%5]+'"><b>'+(z+1)+'. '+esc(c.n)+'</b><br><span class="mu">'+c.questions.length+(c.questions.length===1?' question':' questions')+' · Start mock test</span></button>'}).join('')}
function chapBar(){return '<div class="card"><b>Chapters and parts</b><div style="margin:10px 0">'+D.chapters.map((c,k)=>'<button data-act="selch" data-j="'+k+'"'+(k===ec?' class="p"':'')+' style="margin:0 6px 6px 0">'+esc(c.g&&(c.n||'').indexOf(c.g)!==0?c.g+' · '+(c.n||'New part'):(c.n||'New part'))+'</button>').join('')+'<button data-act="addch" style="margin-bottom:6px">+ New part</button></div><input type="text" data-k="cg" value="'+esc(D.chapters[ec].g||'')+'" placeholder="Chapter name (e.g. History and Evolution)"><div class="row"><input type="text" data-k="cn" value="'+esc(D.chapters[ec].n)+'" placeholder="Part name (e.g. Part 1)"><button data-act="delch">Delete part</button></div><p class="mu">The questions below belong to the selected part. Parts with the same chapter name are grouped together for students. Leave the chapter name empty for a standalone test.</p></div>'}
function full(c){return c.g&&(c.n||'').indexOf(c.g)!==0?c.g+' – '+c.n:c.n}
const brand=()=>'<div class="brand"><div class="bn">Raza Educates Publication</div><div class="bs">Computer Science (B.Tech, BPSC TRE 4, DSSSB &amp; STET)</div><div class="bt">MOCK TEST</div></div>';
function ownerBar(){if(!isOwner)return'';return '<div class="card top"><span class="mu">You are the owner</span><span class="row"><button data-act="edit"'+(mode==='edit'?' class="p"':'')+'>Edit</button><button data-act="prev">Student view</button></span></div>'}
function render(){root.innerHTML=brand()+ownerBar()+(mode==='edit'?editor():student())}
function student(){
if(!V.chapters.length)return '<div class="card"><h1>This quiz is empty</h1></div>';if(ch<0)return home();
if(i<0)return '<div class="card"><h1>'+esc(full(V.chapters[ch]))+'</h1><p class="mu">'+V.questions.length+(V.questions.length===1?' question. ':' questions. ')+'Correct answer: +'+num(V.pm,1)+' marks, '+(num(V.nm,0)?'wrong answer: -'+num(V.nm,0)+' marks':'no negative marking')+'. Skipped questions carry 0 marks. '+(V.tm?V.tm+' seconds per question. ':'')+'The correct answer and explanation are shown after each response.</p><p class="top" style="justify-content:flex-start"><button class="p" data-act="start">Start test</button><button data-act="home">Back to list</button></p></div>';
if(i>=V.questions.length){const n=V.questions.length,pm=num(V.pm,1),nm=num(V.nm,0),mk=Math.round((score*pm-wc*nm)*100)/100,tot=Math.round(n*pm*100)/100,p=Math.round(Math.max(mk,0)*100/(tot||1)),bd=[];if(score===n)bd.push('🏆 Perfect Score');else if(p>=80)bd.push('🌟 Topper');if(bs>=3)bd.push('🔥 '+bs+' correct in a row');if(!skips&&n>2)bd.push('💪 No questions skipped');last='I scored '+mk+'/'+tot+' ('+p+'%) in the "'+full(V.chapters[ch])+'" mock test by Raza Educates Publication (Computer Science). Try it yourself: '+LINK;if(p>=80)setTimeout(()=>confetti(90),150);
return '<div class="card"><h1>'+(V.all&&V.questions.length<V.all.length?'Revision round':'Result')+'</h1><div class="big">'+mk+' / '+tot+'</div><p class="mu">'+p+'% marks</p><div class="ex">Correct: '+score+' | Wrong: '+wc+' | Skipped: '+skips+(nm&&wc?'<br>Negative marking: -'+Math.round(wc*nm*100)/100+' marks':'')+'</div>'+bd.map(b=>'<span class="badge">'+b+'</span>').join('')+(wrong.length?'<h2>Review these questions</h2>'+wrong.map(w=>'<div class="ex"><b>'+esc(w.q)+'</b><br>Correct answer: '+esc(w.o[w.a])+(w.e?'<br>'+esc(w.e):'')+'</div>').join(''):'<p>All correct. Well done!</p>')+'<p class="top" style="justify-content:flex-start"><button class="p" data-act="start">Retake test</button>'+(wrong.length?'<button data-act="retry">Retry missed questions</button>':'')+'<button data-act="home">Back to list</button></p></div>'}
const q=V.questions[i];
if(xa)return '<div class="card"><h2>Exit this test?</h2><p class="mu">Your progress and score for this test will be lost.</p><p class="top" style="justify-content:flex-start"><button class="p" data-act="exityes">Yes, exit</button><button data-act="exitno">Continue test</button></p></div>';
return '<div class="card"><div class="bar"><i style="width:'+(i/V.questions.length*100)+'%"></i></div><div class="top"><div class="mu">Question '+(i+1)+' / '+V.questions.length+(st>1?' · 🔥 '+st+' streak':'')+'</div><button data-act="exitask" style="padding:4px 12px;font-size:13px">Exit test</button></div>'+(V.tm&&picked===null?'<div class="bar" style="margin:8px 0 2px"><i id="tl" style="width:100%;background:var(--no)"></i></div><div class="mu" id="tt">'+V.tm+' s</div>':'')+'<h2>'+esc(q.q)+'</h2>'+q.o.map((t,k)=>{let c='opt';if(picked!==null){if(k===q.a)c+=' ok';else if(k===picked)c+=' no'}return '<button class="'+c+'" data-act="pick" data-j="'+k+'"'+(picked!==null?' disabled':'')+'>'+esc(t)+'</button>'}).join('')+(picked===null?'<button data-act="skip">Skip</button>':'')+(picked!==null?'<div class="ex">'+(picked===q.a?'Correct.':(picked===-1?'Time is up. ':'Wrong. ')+'Correct answer: '+esc(q.o[q.a])+'.')+(q.e?' '+esc(q.e):'')+'</div><p><button class="p" data-act="next">'+(i+1<V.questions.length?'Next question':'View result')+'</button></p>':'')+'</div>'}
function editor(){
D.questions.forEach(q=>{while(q.o.length<4)q.o.push('')});
return '<div class="card"><h1>Build your quiz</h1><p class="mu">Add chapters and questions, pick the correct option for each, then click Publish. After that, use the Share button on this page to send the link to students.</p><input type="text" data-k="title" value="'+esc(D.title)+'" placeholder="Quiz title"></div>'+'<div class="card"><b>Marking scheme</b><div class="row" style="margin-top:8px"><label class="mu">Marks for a correct answer</label><input type="text" inputmode="decimal" data-k="pm" value="'+num(D.pm,1)+'" style="max-width:80px"></div><div class="row"><label class="mu">Marks deducted for a wrong answer</label><input type="text" inputmode="decimal" data-k="nm" value="'+num(D.nm,0)+'" style="max-width:80px"></div><div class="row"><label class="mu">Timer per question (seconds, 0 = no timer)</label><input type="text" inputmode="numeric" data-k="tm" value="'+num(D.tm,30)+'" style="max-width:80px"></div><label class="mu"><input type="checkbox" data-k="sh"'+(D.sh!==false?' checked':'')+'> Shuffle questions and options</label><p class="mu">Example: 1 for correct and 0.25 for wrong applies negative marking. Set wrong to 0 for no negative marking.</p></div>'+
chapBar()+D.questions.map((q,n)=>'<div class="card"><div class="top"><b>Question '+(n+1)+'</b><button data-act="del" data-i="'+n+'">Delete</button></div><textarea data-k="q" data-i="'+n+'" placeholder="Enter the question">'+esc(q.q)+'</textarea>'+q.o.map((t,j)=>'<div class="row"><input type="radio" name="r'+n+'" data-k="a" data-i="'+n+'" data-j="'+j+'"'+(q.a===j?' checked':'')+'><input type="text" data-k="o" data-i="'+n+'" data-j="'+j+'" value="'+esc(t)+'" placeholder="Option '+'ABCD'[j]+'"></div>').join('')+'<input type="text" data-k="e" data-i="'+n+'" value="'+esc(q.e||'')+'" placeholder="Explanation (optional)"></div>').join('')+
'<div class="card"><button data-act="add">+ Add question</button></div>'+
'<div class="card"><b>Bulk import questions</b><p class="mu">Separate questions with a blank line. Format: the question, then options A) B) C) D), then Answer: B, then an optional Explanation: ...</p><textarea id="bulk" style="min-height:140px" placeholder="Who invented the Pascaline?&#10;A) Babbage&#10;B) Pascal&#10;C) Napier&#10;D) Leibniz&#10;Answer: B&#10;Explanation: ..."></textarea><button data-act="import">Add to this part</button><div class="msg" id="imsg"></div></div>'+
'<div class="card"><button class="p" data-act="pub">Publish</button><div class="msg" id="pmsg"></div></div>'}
function parse(t){return t.split(/\n\s*\n/).map(b=>{const L=b.trim().split('\n').map(x=>x.trim()).filter(Boolean);if(L.length<3)return null;const o=[],q=[];let a=-1,e='';L.forEach(l=>{let m;if(m=l.match(/^[A-Da-d][\).:]\s*(.+)/))o.push(m[1]);else if(m=l.match(/^(?:ans(?:wer)?|uttar)\s*[:\-]\s*([A-Da-d1-4])/i))a='abcd1234'.indexOf(m[1].toLowerCase())%4;else if(m=l.match(/^(?:exp(?:lanation)?|vyakhya)\s*[:\-]\s*(.+)/i))e=m[1];else if(!o.length)q.push(l)});return o.length>1&&a>=0&&a<o.length?{q:q.join(' ').replace(/^\d+[\).]\s*/,''),o,a,e}:null}).filter(Boolean)}
root.addEventListener('input',e=>{const t=e.target,k=t.dataset.k,n=+t.dataset.i,j=+t.dataset.j;if(!k)return;if(k==='title')D.title=t.value;else if(k==='pm')D.pm=t.value;else if(k==='nm')D.nm=t.value;else if(k==='cn')D.chapters[ec].n=t.value;else if(k==='cg')D.chapters[ec].g=t.value;else if(k==='tm')D.tm=t.value;else if(k==='sh')D.sh=t.checked;else if(k==='q')D.questions[n].q=t.value;else if(k==='e')D.questions[n].e=t.value;else if(k==='o')D.questions[n].o[j]=t.value;else if(k==='a')D.questions[n].a=j});
root.addEventListener('click',async e=>{const b=e.target.closest('button');if(!b)return;const act=b.dataset.act;
if(act==='start'){begin(V.all||(V.all=V.questions))}
else if(act==='retry'){begin(wrong.slice())}
else if(act==='group'){grp=b.dataset.g;render()}
else if(act==='up'){grp=null;render()}
else if(act==='exitask'){clearInterval(tmr);xa=true;render()}
else if(act==='exitno'){xa=false;render();tick()}
else if(act==='exityes'){xa=false;clearInterval(tmr);ch=-1;i=-1;picked=null;render()}
else if(act==='open'){clearInterval(tmr);ch=+b.dataset.j;V.all=V.chapters[ch].questions;V.questions=V.all;i=-1;picked=null;render()}
else if(act==='home'){clearInterval(tmr);ch=-1;i=-1;picked=null;render()}
else if(act==='selch'){selCh(+b.dataset.j);render()}
else if(act==='addch'){D.chapters.push({g:D.chapters[ec].g||'',n:'',questions:[]});selCh(D.chapters.length-1);render()}
else if(act==='delch'){D.chapters.splice(ec,1);if(!D.chapters.length)D.chapters.push({n:'Chapter 1',questions:[]});selCh(Math.min(ec,D.chapters.length-1));render()}
else if(act==='share'){try{if(navigator.share)await navigator.share({text:last});else throw 0}catch(err){if(!err||err.name!=='AbortError')window.open('https://wa.me/?text='+encodeURIComponent(last),'_blank')}}
else if(act==='pick'){const q=V.questions[i];picked=+b.dataset.j;clearInterval(tmr);if(picked===q.a){score++;st++;bs=Math.max(bs,st);if(st%3===0)confetti(35)}else{wc++;st=0;wrong.push(q)}render()}
else if(act==='next'){i++;picked=null;render();tick()}
else if(act==='skip'){skips++;st=0;wrong.push(V.questions[i]);i++;picked=null;render();tick()}
else if(act==='edit'){clearInterval(tmr);mode='edit';render()}
else if(act==='prev'){clearInterval(tmr);V=clean(D);mode='student';ch=-1;grp=null;i=-1;picked=null;render()}
else if(act==='add'){D.questions.push({q:'',o:['','','',''],a:0,e:''});render();window.scrollTo(0,document.body.scrollHeight)}
else if(act==='del'){D.questions.splice(+b.dataset.i,1);render()}
else if(act==='import'){const r=parse(document.getElementById('bulk').value);if(!r.length){document.getElementById('imsg').textContent='No valid questions found. Please check the format and try again.';return}D.questions.push(...r);render()}
else if(act==='pub'){const pm=document.getElementById('pmsg'),c=clean(D);if(!c.chapters.length){pm.textContent='Add at least one complete question with two or more options.';return}
try{const art=await claude.use('artifact');if(!art){pm.textContent='Publishing is not available here.';return}
const json=JSON.stringify(c).replace(/</g,'\\u003c');
const html='<!DOCTYPE html>\n'+SRC.replace(/(<script type="application\/json" id="quiz-data">)[\s\S]*?(<\/script>)/,(m,a,z)=>a+json+z);
pm.textContent='Publishing...';await art.publish(html)}catch(err){pm.textContent='Could not publish. Please try again.'}}
});
render();
(async()=>{try{if(!window.claude||!claude.use)return;const u=await claude.use('user');if(u&&u.isOwner()){isOwner=true;render()}}catch(e){}})();
</script></body></html>
